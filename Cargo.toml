[package]
name = "erp-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Small ERP example (quotes, orders, invoices, stock) built on the RociaDB Rust SDK"
license = "Apache-2.0"
publish = false

[dependencies]
rocia-db-sdk = "1.0.0"

futures = "0.3"
# `auth::TokenManager` and `auth::fetch_token` take a `reqwest::Client`, so we
# need the same major version the SDK uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
