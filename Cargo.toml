[package]
name = "erp-rocia-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Exemple d'ERP (devis, bons de commande, factures, stock, clients, fournisseurs) bati sur le SDK Rust RociaDB"
license = "Apache-2.0"
publish = false

[dependencies]
rocia-db-sdk = "1.0.0"

chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
# `auth::TokenManager` et `auth::fetch_token` prennent un `reqwest::Client` :
# la meme version majeure que celle du SDK, pour que ce soit bien le meme type.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
